<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Caçadores do Ç</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: ecrã único de jogo, cartão central com mascote Pixel ao lado; barra de navegação em baixo */
:root{--bg:#FFF8F0;--card:#FFFFFF;--fg:#2B3440;--muted:#6B7480;--teal:#5EBFB5;--orange:#E8834A;--blue:#5BA3D0;--green:#6BBF59;--yellow:#FFC857;--red:#E0605A;--line:#E9DFD3;
--fd:'Fredoka',system-ui,sans-serif;--fb:'Nunito',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C2126;--card:#262D34;--fg:#F2EEE8;--muted:#A9B1BA;--line:#3A434C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1C2126;--card:#262D34;--fg:#F2EEE8;--muted:#A9B1BA;--line:#3A434C;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:18px;padding-inline:16px;padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--fd);font-size:1.6rem;margin:0}
h1 span{color:var(--orange)}
.pill{font-family:var(--fd);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-size:1rem}
.pill.apoio{border-color:var(--orange);color:var(--orange)}
.prog{display:flex;gap:6px;flex-wrap:wrap}
.prog i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.prog i.on{background:var(--teal)}.prog i.cur{background:var(--orange);transform:scale(1.25)}
main{flex:1;display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:start}
.mascot{display:flex;flex-direction:column;align-items:center;gap:8px;position:sticky;top:12px}
.mascot img{width:150px}
.bubble{background:var(--card);border:2px solid var(--teal);border-radius:16px;padding:10px 12px;font-weight:700;font-size:.95rem;text-align:center}
.stage{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px;min-width:0}
.stage h2{font-family:var(--fd);margin:0 0 4px;font-size:1.5rem;text-wrap:balance}
.stage .ins{color:var(--muted);margin:0 0 18px;font-weight:700}
.big{font-family:var(--fd);font-size:2.6rem;text-align:center;letter-spacing:.04em;margin:8px 0 18px}
.big .gap{display:inline-block;min-width:1.9em;border-bottom:5px solid var(--orange);color:var(--orange)}
.emoji{font-size:4rem;text-align:center;line-height:1}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
button{font-family:var(--fd);cursor:pointer}
.opt{font-size:1.6rem;min-width:110px;padding:14px 20px;border-radius:16px;border:3px solid var(--line);background:var(--bg);color:var(--fg);transition:transform .1s}
.opt:hover{transform:translateY(-2px);border-color:var(--blue)}
.opt:focus-visible,.nav button:focus-visible,.tile:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.opt.ok{background:var(--green);border-color:var(--green);color:#fff}
.opt.bad{background:var(--red);border-color:var(--red);color:#fff;animation:shake .35s}
.opt.sel{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 15%,var(--card))}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:1.6em;text-align:center;font-weight:800;margin-top:14px;font-size:1.1rem}
.fb.ok{color:var(--green)}.fb.bad{color:var(--red)}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.bin{border:3px dashed var(--line);border-radius:16px;padding:10px;min-height:120px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:var(--bg)}
.bin b{font-family:var(--fd);font-size:1.6rem}
.bin.ca b{color:var(--orange)}.bin.co b{color:var(--blue)}.bin.cu b{color:var(--green)}
.bin span{font-size:1rem;font-weight:700}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{font-family:var(--fd);font-size:1.4rem;padding:10px 16px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--fg)}
.tile.sel{border-color:var(--orange)}
.slot{font-family:var(--fd);font-size:2.2rem;min-height:1.6em;text-align:center;border-bottom:3px solid var(--line);margin:10px auto 16px;max-width:420px}
textarea{width:100%;font-family:var(--fb);font-size:1.3rem;padding:12px;border-radius:14px;border:3px solid var(--line);background:var(--bg);color:var(--fg);min-height:90px}
input.ans{font-family:var(--fd);font-size:1.6rem;padding:8px 14px;border-radius:12px;border:3px solid var(--line);background:var(--bg);color:var(--fg);width:min(280px,100%);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700}
.rule{background:color-mix(in srgb,var(--teal) 14%,var(--card));border-radius:16px;padding:14px 18px;margin-bottom:16px;line-height:1.5}
.rule em{color:var(--orange);font-style:normal;font-weight:800}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.nav button{font-size:1.15rem;padding:12px 22px;border-radius:14px;border:none;background:var(--teal);color:#fff}
.nav button.sec{background:var(--card);color:var(--fg);border:2px solid var(--line)}
.nav button:disabled{opacity:.4;cursor:default}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:10px}
.mode{border:3px solid var(--line);border-radius:20px;padding:18px;background:var(--bg);text-align:left;color:var(--fg)}
.mode:hover{border-color:var(--teal)}
.mode h3{font-family:var(--fd);margin:0 0 6px;font-size:1.4rem}
.mode p{margin:0;color:var(--muted);font-weight:700;font-size:1rem}
.ear{font-size:1rem;padding:6px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);margin-left:8px;vertical-align:middle}
.stars{font-size:2.4rem;text-align:center;letter-spacing:.2em;color:var(--yellow)}
.cwwrap{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.cwgrid{display:grid;gap:4px;width:min(100%,360px)}
.cw{position:relative;aspect-ratio:1;border:2px solid var(--fg);border-radius:6px;background:var(--card)}
.cw small{position:absolute;top:1px;left:4px;font-size:.7rem;font-weight:800;color:var(--muted)}
.cw input{width:100%;height:100%;border:0;background:transparent;text-align:center;font-family:var(--fd);font-size:1.5rem;color:var(--fg);text-transform:uppercase;padding:0}
.cw.pre{background:var(--line)}.cw.good{background:color-mix(in srgb,var(--green) 35%,var(--card))}.cw.wrong{background:color-mix(in srgb,var(--red) 35%,var(--card))}
.clues{display:flex;flex-direction:column;gap:8px}.clue{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-size:1.2rem}
.sky{position:relative;height:420px;border-radius:18px;overflow:hidden;background:linear-gradient(color-mix(in srgb,var(--blue) 22%,var(--card)),var(--card))}
.balloon{position:absolute;top:100%;width:120px;height:140px;border-radius:50% 50% 48% 48%;border:0;color:#fff;font-family:var(--fd);font-size:1.15rem;text-shadow:0 1px 2px rgba(0,0,0,.35);animation:rise linear forwards}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:40px;background:var(--muted)}
.balloon.pop{animation:none;transform:scale(1.4);opacity:0;transition:.3s}.balloon.nope{outline:4px solid var(--red)}
@keyframes rise{to{transform:translateY(-590px)}}
.maze{display:grid;gap:6px;max-width:620px;margin:0 auto}
.mz{position:relative;min-height:64px;border-radius:12px;border:3px solid var(--line);background:var(--bg);color:var(--fg);font-size:1.05rem;padding:6px 2px;overflow-wrap:anywhere}
.mz i{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-style:normal;font-size:.7rem;background:var(--orange);color:#fff;border-radius:6px;padding:0 6px}
.mz.here{background:var(--orange);color:#fff;border-color:var(--orange)}.mz.path{background:var(--green);color:#fff;border-color:var(--green)}
.mz.nope{background:var(--red);color:#fff;animation:shake .35s}
@media (max-width:640px){.mz{font-size:.8rem;min-height:54px}.balloon{width:96px;height:112px;font-size:.95rem}}
@media (max-width:640px){main{grid-template-columns:1fr}.mascot{position:static;flex-direction:row}.mascot img{width:80px}.big{font-size:2rem}.bins{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
<header><h1>Caçadores do <span>Ç</span></h1><div class="prog" id="prog"></div><span class="pill" id="modo">2.º ano</span></header>
<main>
 <div class="mascot"><img id="pimg" alt="Pixel"><div class="bubble" id="pfala">Olá! Eu sou o Pixel.</div></div>
 <section class="stage" id="stage"></section>
</main>
<nav class="nav"><button class="sec" id="bInicio">⌂ Início</button><div style="display:flex;gap:10px"><button class="sec" id="bAnt">← Anterior</button><button id="bProx">Próximo →</button></div></nav>
<footer style="flex:none;text-align:center;font-size:14px;line-height:20px;color:var(--muted);padding:4px 0">CSO · <a href="https://gavetadefichas.wordpress.com" target="_blank" rel="noopener" style="color:inherit">Gaveta de Fichas</a></footer>

function gapWord(w){const i=w[1].findIndex(x=>x.includes('ç'));return{pre:w[1].slice(0,i).join(''),post:w[1].slice(i+1).join(''),sil:w[1][i]}}
function mcRound(opts){ // opts: items [{html,answer,choices,ok}]
  let k=0;const items=opts.items;
  const draw=()=>{
    if(k>=items.length) return opts.done();
    const it=items[k];
    $('#area').innerHTML=`${it.html}<div class="opts">${shuf(it.choices).map(c=>`<button class="opt">${c}</button>`).join('')}</div><div class="fb" id="fb"></div><p class="ins" style="text-align:center;margin-top:8px">${k+1} de ${items.length}</p>`;
    let tried=false;
    document.querySelectorAll('#area .opt').forEach(b=>b.onclick=()=>{
      if(b.textContent===it.answer){b.classList.add('ok');document.querySelectorAll('#area .opt').forEach(x=>x.disabled=true);
        if(!tried)score++;total++;$('#fb').className='fb ok';$('#fb').textContent=it.ok||'Muito bem!';fala('Boa! Continua assim.','consegui');
        if(it.onok)it.onok();tt(()=>{k++;draw()},1300)}
      else{b.classList.add('bad');b.disabled=true;tried=true;$('#fb').className='fb bad';$('#fb').textContent=it.hint||'Tenta outra vez.';fala('Pensa bem… lê a palavra devagar.','pensar')}
    });
  };draw();
}

let T=[];const tt=(f,ms)=>{const id=setTimeout(f,ms);T.push(id);return id};const ti=(f,ms)=>{const id=setInterval(f,ms);T.push(id);return id};
const clearT=()=>{T.forEach(i=>{clearTimeout(i);clearInterval(i)});T=[]};
const fb=(ok,t)=>{const e=$('#fb');if(e){e.className='fb '+(ok?'ok':'bad');e.textContent=t}};

/* ---------- PALAVRAS CRUZADAS ---------- */
function crossword(apoio){
  const R=6,C=7,E=[
   {n:1,w:'TAÇA',r:0,c:5,d:'v',e:'🏆'},{n:2,w:'PALHAÇO',r:2,c:0,d:'h',e:'🤡'},
   {n:3,w:'LAÇO',r:2,c:2,d:'v',e:'🎀'},{n:4,w:'POÇO',r:4,c:0,d:'h',e:'🪣'}];
  const cell={},tgt=new Set(),num={};
  E.forEach(x=>{num[x.r+'-'+x.c]=x.n;[...x.w].forEach((ch,i)=>{const r=x.d==='v'?x.r+i:x.r,c=x.d==='h'?x.c+i:x.c,k=r+'-'+c;cell[k]=ch;
    const j=x.w.indexOf('Ç');if(i===j||i===j+1)tgt.add(k)})});
  let g='';for(let r=0;r<R;r++)for(let c=0;c<C;c++){const k=r+'-'+c;
    if(!cell[k]){g+='<div></div>';continue}
    const pre=apoio&&!tgt.has(k);
    g+=`<div class="cw${pre?' pre':''}">${num[k]?`<small>${num[k]}</small>`:''}<input maxlength="1" data-k="${k}" ${pre?`value="${cell[k]}" readonly tabindex="-1"`:''} aria-label="letra"></div>`}
  $('#area').innerHTML=`<div class="cwwrap"><div class="cwgrid" style="grid-template-columns:repeat(${C},1fr)">${g}</div>
   <div class="clues">${E.map(x=>`<div class="clue"><b>${x.n} ${x.d==='h'?'→':'↓'}</b><span class="emoji" style="font-size:2.4rem">${x.e}</span>${apoio?`<span>${x.w.toLowerCase()}</span>`+ear(x.w.toLowerCase()):''}</div>`).join('')}</div></div>
   <div style="text-align:center;margin-top:12px"><button class="opt" id="ok" style="font-size:1.2rem">Verificar</button></div><div class="fb" id="fb"></div>`;
  const ins=[...document.querySelectorAll('.cwgrid input:not([readonly])')];
  ins.forEach((el,i)=>el.oninput=()=>{el.value=el.value.toUpperCase();if(el.value&&ins[i+1])ins[i+1].focus()});
  $('#ok').onclick=()=>{let bad=0,empty=0;ins.forEach(el=>{const v=el.value.toUpperCase();el.parentNode.classList.remove('good','wrong');
      if(!v){empty++;return}if(v===cell[el.dataset.k])el.parentNode.classList.add('good');else{bad++;el.parentNode.classList.add('wrong')}});
    if(!bad&&!empty){score++;total++;fb(true,'Palavras cruzadas completas!');fala('Resolveste tudo!','uau');tt(doneMsg,1500)}
    else fb(false,empty?'Ainda há quadrados vazios.':'As letras a vermelho estão erradas. Tenta outra vez.')};
  fala(apoio?'Escreve só as letras que faltam: o ç e a vogal.':'Olha para as imagens e escreve as palavras. Não te esqueças do ç!','explicar');
}

/* ---------- JOGO DO BALÃO ---------- */
function balloons(apoio){
  const good=(apoio?EASY:W).map(w=>w[0]);
  const bad=apoio?['sapo','casa','mesa','sumo','bola','vaso','sopa']:['çebola','casa','cenoura','sapo','acucar','almoso','çinema','cigarra','cabesa','sumo','pesoso','vaso'];
  const need=apoio?5:8;let got=0,miss=0;
  $('#area').innerHTML=`<p class="ins" style="text-align:center;margin:0 0 8px">Balões rebentados: <b id="cnt">0</b> de ${need}</p><div class="sky" id="sky"></div><div class="fb" id="fb"></div>`;
  const cols=['var(--orange)','var(--blue)','var(--green)','var(--teal)','var(--yellow)'];let n=0;
  const spawn=()=>{const sky=$('#sky');if(!sky)return;
    const isG=Math.random()<.5,w=isG?shuf(good)[0]:shuf(bad)[0];
    const b=document.createElement('button');b.className='balloon';b.textContent=w;
    b.style.left=(4+Math.random()*70)+'%';b.style.background=cols[n++%cols.length];b.style.animationDuration=(apoio?11:7)+'s';
    b.onclick=()=>{if(b.dataset.done)return;b.dataset.done=1;
      if(good.includes(w)){b.classList.add('pop');got++;$('#cnt').textContent=got;fb(true,`«${w}» tem ça, ço ou çu!`);
        if(got>=need){clearT();score+=miss<3?1:0;total++;tt(doneMsg,700)}}
      else{b.classList.add('nope');miss++;fb(false,`«${w}» é intrusa!`+(w.includes('ç')?' Antes de e/i não há ç.':' Não tem ç.'));fala('Cuidado com as intrusas!','pensar')}};
    b.addEventListener('animationend',()=>b.remove());sky.appendChild(b)};
  spawn();ti(spawn,apoio?2200:1300);
  fala('Rebenta só os balões com ça, ço, çu bem escritos!','explicar');
}

/* ---------- LABIRINTO ---------- */
function maze(apoio){
  const N=apoio?4:5;
  const P=(apoio?['0-0','0-1','1-1','2-1','2-2','2-3','3-3']:['0-0','1-0','2-0','2-1','2-2','1-2','1-3','1-4','2-4','3-4','4-4']);
  const goods=shuf(apoio?EASY:W).map(w=>w[0]);
  const pool=apoio?['sapo','casa','mesa','sumo','bola','vaso','sopa','rosa','osso']:['çebola','casa','cenoura','sapo','almoso','çinema','cigarra','cabesa','sumo','pesoso','vaso','cidade','sopa','cebola'];
  const bads=shuf([...pool,...pool]);let gi=0,bi=0,cur=0;
  let h='';for(let r=0;r<N;r++)for(let c=0;c<N;c++){const k=r+'-'+c,on=P.indexOf(k);
    h+=`<button class="mz${on===0?' here':''}" data-k="${k}">${on>=0?goods[gi++]:bads[bi++]}${on===0?'<i>partida</i>':on===P.length-1?'<i>chegada</i>':''}</button>`}
  $('#area').innerHTML=`<div class="maze" style="grid-template-columns:repeat(${N},1fr)">${h}</div><div class="fb" id="fb"></div>`;
  document.querySelectorAll('.mz').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(b.classList.contains('here')||b.classList.contains('path'))return;
    const [r,c]=k.split('-').map(Number),[cr,cc]=P[cur].split('-').map(Number);
    if(Math.abs(r-cr)+Math.abs(c-cc)!==1){fb(false,'Só podes andar para uma casa ao lado (cima, baixo, esquerda ou direita).');return}
    if(P[cur+1]===k){document.querySelector('.mz.here').classList.replace('here','path');b.classList.add('here');cur++;fb(true,'Boa, «'+b.firstChild.textContent+'» tem ç!');
      if(cur===P.length-1){score++;total++;fala('Saíste do labirinto!','uau');tt(doneMsg,1200)}}
    else{b.classList.add('nope');tt(()=>b.classList.remove('nope'),500);fb(false,`«${b.firstChild.textContent}» é intrusa!`);fala('Essa é intrusa. Procura outro caminho.','pensar')}});
  fala('Segue só as palavras com ça, ço, çu até à chegada.','explicar');
}

/* ---------- FRASES DESORDENADAS ---------- */
function ordFrases(list){
  let k=0;
  const draw=()=>{if(k>=list.length)return doneMsg();const [fr,em]=list[k],ws=fr.split(' ');let built=[];
    let order=shuf(ws.map((w,i)=>[w,i]));if(order.every((x,i)=>x[1]===i))order.reverse();
    $('#area').innerHTML=`${em?`<div class="emoji">${em}</div>`:''}<div class="slot" id="slot" style="font-size:1.6rem;max-width:none"></div><div class="tiles">${order.map(([w,i])=>`<button class="tile" data-i="${i}">${w}</button>`).join('')}</div><div class="fb" id="fb"></div><p class="ins" style="text-align:center">${k+1} de ${list.length} ${MODE==='apoio'?ear(fr):''}</p>`;
    let err=0;
    document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{
      if(ws[+t.dataset.i]===ws[built.length]){built.push(ws[built.length]);t.disabled=true;t.style.opacity=.3;$('#slot').textContent=built.join(' ');
        if(built.length===ws.length){if(!err)score++;total++;fb(true,'Frase certa!');fala('Muito bem ordenada!','consegui');tt(()=>{k++;draw()},1400)}}
      else{err++;fb(false,built.length?'Lê o que já tens. Que palavra vem a seguir?':'A frase começa com letra maiúscula.');fala('Pensa: quem? faz o quê?','pensar')}})};
  draw();
}

/* ---------- NAVEGAÇÃO ---------- */
const list=()=>MODE==='apoio'?APOIO:TURMA;
function home(){clearT();MODE=null;step=0;score=0;total=0;$('#prog').innerHTML='';$('#modo').textContent='2.º ano';$('#modo').className='pill';
  $('#stage').innerHTML=`<h2>Vamos caçar palavras com ç!</h2><p class="ins">Escolhe a versão do jogo.</p><div class="home">
  <button class="mode" id="mT"><h3>Turma</h3><p>11 desafios: completar, classificar, palavras cruzadas, balões, labirinto, sílabas e frases desordenadas, adivinhas e escrita.</p></button>
  <button class="mode" id="mA" style="border-color:var(--orange)"><h3>Apoio</h3><p>10 desafios curtos com imagens, poucas opções e botão para ouvir. Para jogar com o professor de apoio.</p></button></div>`;
  $('#mT').onclick=()=>start('turma');$('#mA').onclick=()=>start('apoio');
  $('#bAnt').disabled=true;$('#bProx').disabled=true;fala('Olá! Eu sou o Pixel. Escolhe como queres jogar.','ola')}
function start(m){MODE=m;step=0;$('#modo').textContent=m==='apoio'?'Apoio':'Turma';$('#modo').className='pill'+(m==='apoio'?' apoio':'');show()}
function show(){clearT();try{speechSynthesis.cancel()}catch(e){}const L=list();
  if(step>=L.length){$('#stage').innerHTML=`<h2>Parabéns, caçador do ç!</h2><div class="stars">★★★★★</div><p class="big" style="font-size:1.6rem">Acertaste à primeira ${score} vezes em ${total}.</p>`;fala('És um verdadeiro caçador do ç!','uau');$('#bProx').disabled=true;$('#bAnt').disabled=false;prog();return}
  const g=L[step];$('#stage').innerHTML=`<h2>${step?step+'. ':''}${g.t}</h2><p class="ins">${g.ins}</p><div id="area"></div>`;g.run();
  $('#bAnt').disabled=step===0;$('#bProx').disabled=false;prog()}
function prog(){$('#prog').innerHTML=list().map((_,i)=>`<i class="${i<step?'on':i===step?'cur':''}"></i>`).join('')}
$('#bInicio').onclick=home;$('#bAnt').onclick=()=>{if(step>0){step--;show()}};$('#bProx').onclick=()=>{step++;show()};
home();
</script>
