<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Números amigos e decomposição — 2.º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF4FF;--card:#FFFFFF;--ink:#1B2A4A;--azul:#1E6FD9;--sol:#FFC93C;--verde:#2E9E55;--rosa:#E84F8A;--pixel:#6A4FD1;--suave:#C9DCF5;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1B30;--card:#18294A;--ink:#EAF2FF;--suave:#2B4470}}
:root[data-theme="dark"]{--bg:#0F1B30;--card:#18294A;--ink:#EAF2FF;--suave:#2B4470}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",sans-serif;font-size:1.25rem}
header{padding:1rem 1.2rem .4rem;max-width:960px;margin:auto;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between}
h1{margin:0;font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.1}
.estrelas{background:var(--sol);color:#1B2A4A;border-radius:999px;padding:.2rem 1rem;font-weight:800;font-size:1.3rem}
nav{max-width:960px;margin:.4rem auto;padding:0 1.2rem;display:flex;flex-wrap:wrap;gap:.5rem}
nav button{font:inherit;font-weight:700;border:3px solid var(--azul);background:var(--card);color:var(--ink);border-radius:14px;padding:.35rem 1rem;cursor:pointer}
nav button[aria-selected="true"]{background:var(--azul);color:#fff}
nav button.feita::after{content:' ✔'}
main{max-width:960px;margin:0 auto;padding:1rem 1.2rem 2rem}
.painel{background:var(--card);border-radius:24px;padding:1.4rem;border:3px solid var(--suave);text-align:center}
.pergunta{font-size:clamp(2rem,7vw,3.6rem);font-weight:800;margin:.4rem 0 1rem}
.dica{margin:.2rem 0 .8rem;opacity:.85}
.opcoes{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center}
.opcoes button,.num{font:inherit;font-weight:800;font-size:2rem;min-width:5.5rem;padding:.4rem .9rem;border-radius:18px;border:3px solid var(--azul);background:var(--card);color:var(--ink);cursor:pointer}
.opcoes button:hover,.num:hover{background:var(--suave)}
button:focus-visible,input:focus-visible{outline:4px solid var(--rosa);outline-offset:3px}
.certo{background:var(--verde)!important;color:#fff!important;border-color:var(--verde)!important}
.errado{background:var(--rosa)!important;color:#fff!important;border-color:var(--rosa)!important}
.fb{min-height:2.2rem;font-weight:700;margin-top:1rem;font-size:1.4rem}
.seguinte{font:inherit;font-weight:800;background:var(--sol);color:#1B2A4A;border:none;border-radius:16px;padding:.5rem 1.4rem;cursor:pointer;margin-top:.6rem}
/* moldura de 10 */
.moldura{display:inline-grid;grid-template-columns:repeat(5,44px);gap:6px;padding:10px;border:3px solid var(--ink);border-radius:12px;margin-bottom:.6rem}
.moldura span{width:44px;height:44px;border:2px dashed var(--suave);border-radius:50%}
.moldura span.on{background:var(--azul);border:none}
/* barras de dezenas */
.barras{display:flex;gap:5px;justify-content:center;align-items:flex-end;min-height:130px;margin-bottom:.6rem;flex-wrap:wrap}
.barra{width:16px;height:120px;border-radius:4px;background:repeating-linear-gradient(var(--azul) 0 10px,#fff 10px 12px)}
.barra.vazia{background:repeating-linear-gradient(var(--suave) 0 10px,transparent 10px 12px)}
.cubo{width:14px;height:14px;background:var(--verde);border-radius:3px}
.cubos{display:flex;flex-wrap:wrap;width:50px;gap:3px;align-content:flex-end}
.placa{width:120px;height:120px;border-radius:4px;background:
 repeating-linear-gradient(90deg,var(--sol) 0 10px,#fff 10px 12px);outline:2px solid var(--sol)}
.fila{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin:.8rem 0}
.fila.resposta .num{border-style:dashed;min-width:5rem;cursor:default}
table.classes{margin:.8rem auto;border-collapse:collapse;font-size:1.5rem}
.classes th,.classes td{border:3px solid var(--ink);padding:.3rem .8rem}
.classes th.c{background:var(--sol);color:#1B2A4A}.classes th.d{background:var(--azul);color:#fff}.classes th.u{background:var(--verde);color:#fff}
.classes input,.decomp input{font:inherit;font-weight:800;width:3.4rem;text-align:center;font-size:1.8rem;border:3px solid var(--suave);border-radius:10px;background:var(--bg);color:var(--ink)}
.decomp{font-size:1.8rem;font-weight:800;margin:.6rem 0}
.decomp input{width:4.6rem}

.pixelbox{display:flex;gap:1rem;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:.4rem}
.pixelbox img{width:120px;height:auto;flex:none;background:#fff;border-radius:18px;padding:4px}
.balao{background:var(--bg);border:3px solid #6A4FD1;border-radius:20px;padding:.5rem 1rem;max-width:520px;text-align:left;font-weight:700}
.progresso{height:14px;background:var(--suave);border-radius:999px;overflow:hidden;margin:.2rem 0 1rem}
.progresso div{height:100%;background:#6A4FD1;transition:width .3s}
.missoes{list-style:none;padding:0;display:grid;gap:.5rem;max-width:520px;margin:1rem auto;text-align:left}
.missoes li{border:3px solid var(--suave);border-radius:14px;padding:.3rem .8rem}
.missoes li.feita{border-color:var(--verde)}

.abaco{display:inline-flex;gap:26px;padding:10px 26px 0;border-bottom:8px solid #8B5E3C;margin-bottom:.3rem}
.haste{width:6px;height:180px;background:#E0B25A;position:relative;display:flex;flex-direction:column-reverse;align-items:center}
.conta{width:38px;height:13px;border-radius:7px;margin-top:2px;flex:none}
.haste.d .conta{background:var(--rosa)}.haste.u .conta{background:#29A9D8}
.rotulos{display:flex;gap:26px;justify-content:center;font-weight:800}.rotulos span{width:6px;display:flex;justify-content:center}
.reta{position:relative;height:90px;margin:1rem auto;max-width:720px}
.reta .linha{position:absolute;left:3%;right:3%;top:40px;height:5px;background:var(--azul);border-radius:3px}
.marca{position:absolute;top:22px;transform:translateX(-50%);width:38px;height:44px;border:none;background:none;cursor:pointer;font:inherit;padding:0;color:var(--ink)}
.marca::before{content:'';position:absolute;left:17px;top:6px;width:4px;height:28px;background:var(--ink);border-radius:2px}
.marca span{position:absolute;top:42px;left:0;right:0;font-weight:800;font-size:1.1rem}
.marca.certo::before,.marca.errado::before{width:30px;height:30px;left:4px;top:5px;border-radius:50%}
.marca.certo::before{background:var(--verde)}.marca.errado::before{background:var(--rosa)}
.opcoes button.texto{font-size:1.4rem}

.baloes{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin:.6rem 0}
.balaoN{font:inherit;font-weight:800;font-size:1.8rem;width:92px;height:110px;border-radius:50% 50% 48% 48%;border:3px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;position:relative}
.balaoN::after{content:'';position:absolute;left:50%;bottom:-22px;width:2px;height:20px;background:var(--ink)}
.balaoN.pintado{background:var(--sol);color:#1B2A4A}
.cadeia{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center;align-items:center;margin:.8rem 0}
.cadeia .caixa{min-width:3.6rem;padding:.2rem .5rem;border:3px solid var(--azul);border-radius:12px;font-weight:800;font-size:1.6rem}
.cadeia .caixa.atual{border-style:dashed;background:var(--suave)}
.cadeia .seta{font-weight:800;color:var(--rosa);font-size:1.1rem}
.arvore{display:grid;gap:.6rem;justify-items:center;margin:.6rem 0;font-weight:800;font-size:1.7rem}
.arvore .nivel{display:flex;gap:.5rem;align-items:center}
.arvore .caixa{min-width:3.6rem;padding:.2rem .6rem;border:3px solid #5EBFB5;border-radius:12px;background:var(--card)}
.arvore .caixa.atual{border-style:dashed;background:var(--suave)}

body.apoio .opcoes button,body.apoio .num{font-size:2.6rem;min-width:7rem;padding:.6rem 1.2rem}
body.apoio .pergunta{font-size:clamp(2.4rem,8vw,4.2rem)}
.pista{outline:5px solid var(--sol);outline-offset:4px}
@media (prefers-reduced-motion:no-preference){.pista{animation:pisca 1s infinite}}
@keyframes pisca{50%{outline-color:transparent}}
.ouvir{font:inherit;border:none;background:#5EBFB5;color:#fff;border-radius:50%;width:2.4rem;height:2.4rem;cursor:pointer;flex:none;font-size:1.2rem}
.perfis{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin:1rem 0}
.perfis button{font:inherit;font-weight:800;font-size:1.4rem;padding:.7rem 1.4rem;border-radius:18px;border:4px solid var(--azul);background:var(--card);color:var(--ink);cursor:pointer}
.perfis button[aria-pressed="true"]{background:var(--azul);color:#fff}
.selo{display:inline-block;background:#5EBFB5;color:#fff;border-radius:999px;padding:0 .7rem;font-size:1rem;margin-left:.4rem}
footer{text-align:center;opacity:.7;font-size:1rem;padding-bottom:1.5rem}
@media (max-width:520px){.moldura{grid-template-columns:repeat(5,34px)}.moldura span{width:34px;height:34px}.opcoes button,.num{font-size:1.6rem;min-width:4.4rem}}
@media (prefers-reduced-motion:no-preference){.certo{animation:pula .35s}}
@keyframes pula{50%{transform:scale(1.12)}}
</style>
</head>

 <h1>Números amigos e decomposição</h1>
 <div><span class="selo" id="modo"></span> <span class="estrelas" aria-live="polite">⭐ <span id="pontos">0</span></span></div>
</header>

function pixel(pose){return `<img src="${PIXEL[pose]||PIXEL.ola}" alt="Pixel">`}
let APOIO=false;
function total(k){const m=MISSOES[k||jogo];return APOIO?Math.max(2,Math.ceil(m.n/2)):m.n}
function dizer(txt){try{const t=txt.replace(/<[^>]+>/g,'');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-PT';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function falar(pose,txt){if(APOIO)setTimeout(()=>dizer(txt),50);return `<div class="pixelbox" id="pix">${pixel(pose)}<div class="balao">${txt}</div><button class="ouvir" aria-label="Ouvir" onclick='dizer(${JSON.stringify(txt).replace(/'/g,"&#39;")})'>🔊</button></div>`}
function pixelDiz(pose,txt){const b=document.getElementById('pix');if(b)b.outerHTML=falar(pose,txt)}

// ---------- estrutura da aula ----------
const MISSOES={a10:{nome:'Amigos do 10',n:8,min:'10 min'},a100:{nome:'Amigos do 100',n:8,min:'12 min'},ordem:{nome:'Por ordem',n:5,min:'10 min'},classes:{nome:'Ordens e decomposição',n:6,min:'13 min'},abaco:{nome:'Ábaco',n:6,min:'8 min'},extenso:{nome:'Decompor e ler',n:5,min:'10 min'},reta:{nome:'Reta numérica',n:6,min:'8 min'},pares:{nome:'Balões pares',n:4,min:'6 min'},setas:{nome:'Saltos de 5 e de 10',n:4,min:'8 min'},arvore:{nome:'Árvore do 100',n:3,min:'5 min'},desafio:{nome:'Desafio final',n:8,min:'8 min'}};
const feitas={};let conta=0;
function cabecalho(pose,txt){const m=MISSOES[jogo];return falar(pose,txt)+`<div class="progresso" aria-label="Progresso"><div style="width:${conta/total()*100}%"></div></div><p class="dica">Pergunta ${conta+1} de ${total()}</p>`}
function inicio(){
 P.innerHTML=falar('ola','Olá! Eu sou o Pixel. Hoje vamos ser detetives dos números! Completa as missões pela ordem.')+
 `<ol class="missoes">${Object.entries(MISSOES).map(([k,m])=>`<li class="${feitas[k]?'feita':''}">${feitas[k]?'✔ ':''}${m.nome} <small>(${total(k)} desafios)</small></li>`).join('')}</ol>
 <p class="dica">Escolhe o perfil:</p><div class="perfis"><button id="pNormal" aria-pressed="${!APOIO}">Perfil normal</button><button id="pApoio" aria-pressed="${APOIO}">Perfil com apoio 🤝</button></div>
 <button class="seguinte" id="comecar">${Object.keys(feitas).length?'Continuar':'Começar'}</button>`;
 const setP=v=>{APOIO=v;document.body.classList.toggle('apoio',v);document.getElementById('modo').textContent=v?'Apoio':'';inicio()};document.getElementById('pNormal').onclick=()=>setP(false);document.getElementById('pApoio').onclick=()=>setP(true);
 document.getElementById('comecar').onclick=()=>{const prox=Object.keys(MISSOES).find(k=>!feitas[k])||'desafio';mudar(prox)}}
function concluir(){
 feitas[jogo]=true;document.querySelector(`nav [data-j="${jogo}"]`).classList.add('feita');
 const todas=Object.keys(MISSOES).every(k=>feitas[k]);
 P.innerHTML=falar(todas?'uau':'consegui',todas?`Uau! Completaste todas as missões com ${pontos} estrelas. És um verdadeiro detetive dos números!`:`Missão "${MISSOES[jogo].nome}" concluída!`)+
 `<button class="seguinte" id="prox">${todas?'Voltar ao início':'Próxima missão'}</button>`;
 document.getElementById('prox').onclick=()=>{const p=Object.keys(MISSOES).find(k=>!feitas[k]);mudar(p||'inicio')};document.getElementById('prox').focus()}
function mudar(j){jogo=j;conta=0;document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x.dataset.j===j));novo()}
function desafio(){const t=['a10','abaco','a100','extenso','ordem','reta','classes','pares'][conta%8];jogos[t](true)}

const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const baralha=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const elogios=['Muito bem!','Excelente!','Boa!','Fantástico!','Isso mesmo!'];
function ganhar(){pontos++;document.getElementById('pontos').textContent=pontos}
function botaoSeguinte(){pixelDiz(['consegui','uau'][rnd(0,1)],elogios[rnd(0,4)]);const b=document.createElement('button');b.className='seguinte';b.textContent='Continuar';b.onclick=()=>{if(b.disabled)return;b.disabled=true;conta++;conta>=total()?concluir():novo()};P.appendChild(b);b.focus()}
function opcoes(certa,distr,fb){
 const box=P.querySelector('.opcoes');let feito=false;
 distr=[...new Set(distr)].filter(v=>v!==certa).slice(0,APOIO?2:3);let erros=0;
 baralha([certa,...distr]).forEach(v=>{const b=document.createElement('button');b.textContent=v;
  b.onclick=()=>{if(feito)return;
   if(v===certa){b.classList.add('certo');fb.textContent=elogios[rnd(0,4)];feito=true;ganhar();botaoSeguinte()}
   else{b.classList.add('errado');b.disabled=true;fb.textContent='Ainda não. Tenta outra vez!';pixelDiz('explicar','Conta com calma o que falta.');if(APOIO&&++erros>=1)[...box.children].find(x=>x.textContent==String(certa))?.classList.add('pista')}};
  box.appendChild(b)})}
function distratores(certa,min,max,passo,n=3){const s=new Set();while(s.size<n){const v=rnd(min/passo,max/passo)*passo;if(v!==certa)s.add(v)}return[...s]}

function amigos10(){
 const a=rnd(1,9),c=10-a;
 P.innerHTML=cabecalho('pensar','Quantas bolinhas faltam para encher a moldura?')+`
 <div class="moldura">${Array.from({length:10},(_,i)=>`<span class="${i<a?'on':''}"></span>`).join('')}</div>
 <div class="pergunta">${a} + ? = 10</div><div class="opcoes"></div><div class="fb" aria-live="polite"></div>`;
 opcoes(c,distratores(c,0,10,1),P.querySelector('.fb'))}

function amigos100(){
 const redondo=APOIO||Math.random()<.6;const a=redondo?rnd(1,9)*10:rnd(11,89);const c=100-a;
 const dz=Math.floor(a/10);
 P.innerHTML=cabecalho('pensar','Quanto falta para chegar a 100? Cada barra vale 10.')+`
 <div class="barras">${Array.from({length:10},(_,i)=>`<div class="barra ${i<dz?'':'vazia'}"></div>`).join('')}
 ${a%10?`<div class="cubos">${Array.from({length:a%10},()=>'<div class="cubo"></div>').join('')}</div>`:''}</div>
 <div class="pergunta">${redondo&&conta%2?`${a} + ${c} = ?`:`${a} + ? = 100`}</div><div class="opcoes"></div><div class="fb" aria-live="polite"></div>`;
 if(redondo&&conta%2){opcoes(100,[90,110,80],P.querySelector('.fb'));return}
 const d=redondo?distratores(c,10,90,10):[c+10,c-10,c+1].filter(v=>v>0&&v<100);
 while(d.length<3)d.push(c+2);opcoes(c,d,P.querySelector('.fb'))}

function ordem(){
 const s=new Set();const base=APOIO?rnd(0,3)*10:rnd(0,7)*10;const qt=APOIO?4:5;while(s.size<qt)s.add(rnd(base,base+(APOIO?15:(Math.random()<.5?30:60))));
 const nums=[...s],cresc=APOIO||Math.random()<.6,ok=[...nums].sort((x,y)=>cresc?x-y:y-x);let pos=0;
 P.innerHTML=cabecalho('pensar',`Toca nos números por ordem <b>${cresc?'crescente (do menor para o maior)':'decrescente (do maior para o menor)'}</b>.`)+`
 <div class="fila" id="orig"></div><div class="fila resposta" id="resp">${nums.map(()=>'<span class="num">&nbsp;</span>').join('')}</div>
 <div class="fb" aria-live="polite"></div>`;
 const fb=P.querySelector('.fb'),slots=P.querySelectorAll('#resp .num');
 baralha(nums).forEach(v=>{const b=document.createElement('button');b.className='num';b.textContent=v;
  b.onclick=()=>{if(v===ok[pos]){slots[pos].textContent=v;slots[pos].classList.add('certo');b.style.visibility='hidden';pos++;fb.textContent='';
    if(pos===nums.length){fb.textContent=elogios[rnd(0,4)]+' Ficou tudo por ordem.';ganhar();botaoSeguinte()}}
   else{b.classList.add('errado');fb.textContent=`O ${v} não é o próximo. Procura o ${cresc?'menor':'maior'} que falta.`;setTimeout(()=>b.classList.remove('errado'),700)}};
  P.querySelector('#orig').appendChild(b)})}

function classes(){
 // Versão concreta: só dezenas e unidades, passo a passo, com escolha múltipla
 const d=APOIO?rnd(1,3):rnd(1,5),u=APOIO?rnd(1,5):rnd(1,9),n=d*10+u;let passo=0;
 const blocos=`${Array.from({length:d},()=>'<div class="barra"></div>').join('')}<div class="cubos">${Array.from({length:u},()=>'<div class="cubo"></div>').join('')}</div>`;
 const passos=[
  {txt:'Conta as barras azuis. Cada barra é uma <b>dezena</b> (10).',perg:'Quantas barras?',certa:d,distr:[d+1,d-1,u].filter(v=>v>0&&v!==d)},
  {txt:'Agora conta os cubinhos verdes. Cada cubo é uma <b>unidade</b> (1).',perg:'Quantos cubos?',certa:u,distr:[u+1,u-1,d].filter(v=>v>0&&v!==u)},
  {txt:`Temos ${d} dezena${d>1?'s':''} e ${u} unidade${u>1?'s':''}. Que número é?`,perg:`${d} D e ${u} U`,certa:n,distr:[u*10+d,n+10,n+1].filter(v=>v!==n)},
  {txt:`Muito bem! Agora escolhe a decomposição do ${n}.`,perg:`${n} = ?`,certa:`${d*10} + ${u}`,distr:[`${d} + ${u}`,`${u*10} + ${d}`,`${d*10} + ${u+1}`]}
 ];
 function mostra(){const p=passos[passo];
  P.innerHTML=cabecalho('pensar',p.txt)+`<div class="barras">${blocos}</div>
  <table class="classes"><tr><th class="d">D</th><th class="u">U</th></tr><tr><td>${passo>=1?d:'?'}</td><td>${passo>=2?u:'?'}</td></tr></table>
  <div class="pergunta">${p.perg}</div><div class="opcoes"></div><div class="fb" aria-live="polite"></div>`;
  const fb=P.querySelector('.fb'),box=P.querySelector('.opcoes');let feito=false;
  baralha([p.certa,...[...new Set(p.distr)].filter(v=>v!==p.certa).slice(0,3)]).forEach(v=>{const bt=document.createElement('button');bt.textContent=v;
   bt.onclick=()=>{if(feito)return;
    if(v===p.certa){bt.classList.add('certo');feito=true;
     if(passo<3){fb.textContent='Certo!';setTimeout(()=>{passo++;mostra()},700)}
     else{fb.textContent=`${n} tem ${d} dezena${d>1?'s':''} e ${u} unidade${u>1?'s':''}.`;ganhar();botaoSeguinte()}}
    else{bt.classList.add('errado');bt.disabled=true;if(APOIO)[...box.children].find(x=>x.textContent==String(typeof p!=='undefined'?p.certa:c))?.classList.add('pista');fb.textContent='Ainda não. Conta outra vez com o dedo!';pixelDiz('explicar','Aponta para cada bloco enquanto contas.')}};
   box.appendChild(bt)})}
 mostra()}


const UNI=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','catorze','quinze','dezasseis','dezassete','dezoito','dezanove'];
const DEZ=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
function extensoN(n){if(n===100)return'cem';if(n<20)return UNI[n];const d=Math.floor(n/10),u=n%10;return DEZ[d]+(u?' e '+UNI[u]:'')}
function abacoHTML(d,u){const h=(c,k)=>`<div class="haste ${c}">${Array.from({length:k},()=>'<div class="conta"></div>').join('')}</div>`;
 return `<div><div class="abaco">${h('d',d)}${h('u',u)}</div><div class="rotulos"><span>D</span><span>U</span></div></div>`}
function abaco(){
 const d=APOIO?rnd(1,4):rnd(1,9),u=APOIO?rnd(1,5):rnd(0,9),n=d*10+u;
 P.innerHTML=cabecalho('pensar','Conta as contas de cada haste. As cor-de-rosa são dezenas, as azuis são unidades. Que número está no ábaco?')+abacoHTML(d,u)+
 `<div class="opcoes" style="margin-top:1rem"></div><div class="fb" aria-live="polite"></div>`;
 opcoes(n,[u*10+d,n+10,n-1].filter(v=>v!==n&&v>0).concat([n+1]).slice(0,3),P.querySelector('.fb'))}
function extenso(){
 const n=APOIO?rnd(12,39):rnd(12,99),d=Math.floor(n/10),u=n%10,dec=Array(d).fill('10').join(' + ')+(u?' + '+u:'');
 const tipo=APOIO?conta%2:conta%3;let txt,perg,certa,distr;
 if(tipo===0){txt='Qual é a decomposição deste número? Segue o exemplo: 23 = 10 + 10 + 3.';perg=n;certa=dec;
  distr=[Array(d+1).fill('10').join(' + ')+(u?' + '+u:''),Array(Math.max(d-1,1)).fill('10').join(' + ')+(u?' + '+u:''),Array(d).fill('10').join(' + ')+' + '+(u+1)]}
 else if(tipo===1){txt='Que número está decomposto?';perg=dec;certa=n;distr=[n+10,u*10+d,n+1].filter(v=>v!==n)}
 else{txt='Como se lê este número por extenso?';perg=n;certa=extensoN(n);distr=[extensoN(u*10+d),extensoN(Math.min(n+10,99)),extensoN(n===99?98:n+1)].filter(v=>v!==certa)}
 P.innerHTML=cabecalho('pensar',txt)+`<div class="pergunta" style="font-size:clamp(1.5rem,5vw,3rem)">${perg}</div><div class="opcoes"></div><div class="fb" aria-live="polite"></div>`;
 opcoes(certa,[...new Set(distr)].slice(0,3),P.querySelector('.fb'));
 P.querySelectorAll('.opcoes button').forEach(b=>b.classList.add('texto'))}
function reta(){
 const centena=conta===total('reta')-1;const alvo=centena?100:rnd(1,9)*10;const visiveis=[0,60,90];
 P.innerHTML=cabecalho('pensar',centena?'Toca no número que representa <b>uma centena</b>.':`Onde fica o <b>${alvo}</b> na reta? Toca no tracinho certo. Conta de 10 em 10!`)+
 `<div class="reta"><div class="linha"></div></div><div class="fb" aria-live="polite"></div>`;
 const r=P.querySelector('.reta'),fb=P.querySelector('.fb');let feito=false;
 for(let v=0;v<=100;v+=10){const m=document.createElement('button');m.className='marca';m.style.left=(3+v*0.94)+'%';m.setAttribute('aria-label','tracinho '+(v/10+1));
  m.innerHTML=`<span>${visiveis.includes(v)?v:''}</span>`;
  m.onclick=()=>{if(feito)return;if(v===alvo){feito=true;m.classList.add('certo');m.querySelector('span').textContent=v;ganhar();botaoSeguinte()}
   else{m.classList.add('errado');m.querySelector('span').textContent=v;fb.textContent='Ainda não. Parte do 0 e conta 10, 20, 30…';pixelDiz('explicar','Cada tracinho avança 10.')}};
  r.appendChild(m)}}

function pares(){
 const s=new Set();while(s.size<(APOIO?6:8))s.add(APOIO?rnd(1,30):rnd(10,100));const nums=[...s];if(nums.every(v=>v%2))nums[0]++;
 P.innerHTML=cabecalho('pensar','Pinta os balões com números <b>pares</b>. Olha para o algarismo das unidades: 0, 2, 4, 6 ou 8.')+
 `<div class="baloes"></div><button class="seguinte" id="verif">Verificar</button><div class="fb" aria-live="polite"></div>`;
 const box=P.querySelector('.baloes'),fb=P.querySelector('.fb');
 nums.forEach(v=>{const b=document.createElement('button');b.className='balaoN';b.textContent=v;b.setAttribute('aria-pressed','false');
  b.onclick=()=>{b.classList.toggle('pintado');b.setAttribute('aria-pressed',b.classList.contains('pintado'));b.classList.remove('certo','errado')};box.appendChild(b)});
 document.getElementById('verif').onclick=function(){let ok=true;
  box.querySelectorAll('.balaoN').forEach(b=>{const par=+b.textContent%2===0,pint=b.classList.contains('pintado');if(par!==pint){ok=false;b.classList.add('errado')}});
  if(ok){fb.textContent='Todos os pares estão pintados!';ganhar();this.remove();botaoSeguinte()}
  else{fb.textContent='Os balões cor-de-rosa estão trocados. Vê o último algarismo.';pixelDiz('explicar','Um número é par se acabar em 0, 2, 4, 6 ou 8.')}}}
function setas(){
 const saltos=Array.from({length:APOIO?4:6},()=>APOIO?10:(Math.random()<.5?5:10));let v=APOIO?rnd(0,4)*10:rnd(1,8)*5;
 const vals=[v];saltos.forEach(x=>vals.push(vals[vals.length-1]+x));let i=1;
 function mostra(){
  P.innerHTML=cabecalho('pensar','Completa a sequência seguindo o valor das setas.')+
  `<div class="cadeia">${vals.map((x,k)=>(k?`<span class="seta">+${saltos[k-1]}→</span>`:'')+`<span class="caixa ${k===i?'atual':''}">${k<i?x:(k===i?'?':'&nbsp;')}</span>`).join('')}</div>
  <div class="pergunta">${vals[i-1]} + ${saltos[i-1]} = ?</div><div class="opcoes"></div><div class="fb" aria-live="polite"></div>`;
  const c=vals[i],fb=P.querySelector('.fb'),box=P.querySelector('.opcoes');let feito=false;
  baralha([c,c+5,c-5>vals[i-1]?c-5:c+10,c+1]).forEach(x=>{const b=document.createElement('button');b.textContent=x;
   b.onclick=()=>{if(feito)return;if(x===c){feito=true;b.classList.add('certo');
     if(i<vals.length-1){setTimeout(()=>{i++;mostra()},600)}else{i++;P.querySelector('.cadeia').innerHTML=vals.map((x,k)=>(k?`<span class="seta">+${saltos[k-1]}→</span>`:'')+`<span class="caixa">${x}</span>`).join('');fb.textContent='Sequência completa!';ganhar();botaoSeguinte()}}
    else{b.classList.add('errado');b.disabled=true;if(APOIO)[...box.children].find(x=>x.textContent==String(c))?.classList.add('pista');fb.textContent=`Olha para a seta: soma ${saltos[i-1]}.`}};box.appendChild(b)})}
 mostra()}
function arvore(){
 const opcoesArv=[[50,25],[60,30],[40,20],[70,30],[80,40],[50,20]];const [a,b]=APOIO?[50,25]:opcoesArv[rnd(0,opcoesArv.length-1)];
 const passos=[{p:`100 = ${a} + ?`,c:100-a},{p:`${a} = ${b} + ?`,c:a-b},{p:`${100-a} = ${Math.min(b,100-a-5)} + ?`,c:100-a-Math.min(b,100-a-5)}];
 const bR=Math.min(b,100-a-5);let i=0;
 function mostra(){const v=(k,x)=>k<i?x:(k===i?'?':'&nbsp;');
  P.innerHTML=cabecalho('pensar','Decompõe o 100 completando os espaços em branco.')+
  `<div class="arvore"><div class="nivel"><span class="caixa">100</span></div>
   <div class="nivel"><span class="caixa">${a}</span>+<span class="caixa ${i===0?'atual':''}">${v(0,100-a)}</span></div>
   <div class="nivel"><span class="caixa">${b}</span>+<span class="caixa ${i===1?'atual':''}">${v(1,a-b)}</span>+<span class="caixa">${i>=1?bR:'&nbsp;'}</span>+<span class="caixa ${i===2?'atual':''}">${v(2,100-a-bR)}</span></div></div>
   <div class="pergunta" style="font-size:2.2rem">${passos[i].p}</div><div class="opcoes"></div><div class="fb" aria-live="polite"></div>`;
  const c=passos[i].c,fb=P.querySelector('.fb'),box=P.querySelector('.opcoes');let feito=false;
  baralha([...new Set([c,c+10,c+5,Math.abs(c-10)||c+15])]).forEach(x=>{const bt=document.createElement('button');bt.textContent=x;
   bt.onclick=()=>{if(feito)return;if(x===c){feito=true;bt.classList.add('certo');if(i<2)setTimeout(()=>{i++;mostra()},600);else{i=3;fb.textContent='O 100 ficou decomposto!';ganhar();botaoSeguinte()}}
    else{bt.classList.add('errado');bt.disabled=true;if(APOIO)[...box.children].find(x=>x.textContent==String(typeof p!=='undefined'?p.certa:c))?.classList.add('pista');fb.textContent='Ainda não. Usa os amigos do 10 e do 100.'}};box.appendChild(bt)})}
 mostra()}

const jogos={inicio,pares,setas,arvore,abaco,extenso,reta,a10:amigos10,a100:amigos100,ordem,classes,desafio};
function novo(){jogos[jogo]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>mudar(b.dataset.j));
mudar('inicio');
</script>
