<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Números até 5 com o Byte</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
html{color-scheme:light}
:root{--laranja:#E8834A;--creme:#FFF8F0;--azul:#5BA3D0;--verde:#6BBF59;--amarelo:#FFC857;--byte:#3B7DD8;--byte-esc:#245BA8;--texto:#2D3047;--vermelho:#E5574F;--borda:#F1E4D3;--sombra:0 6px 0 rgba(0,0,0,.10);
--fT:'Fredoka','Trebuchet MS',system-ui,sans-serif;--fC:'Nunito',system-ui,sans-serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--fC);background:var(--creme);color:var(--texto);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;color:inherit}
#app{display:flex;flex-direction:column;height:100%}

/* topo */
#topo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 14px;background:var(--byte);color:#fff;min-height:60px}
.t-titulo{display:flex;align-items:center;gap:10px;font-family:var(--fT);font-weight:600;font-size:clamp(16px,2.4vw,24px);min-width:0}
#tIcone{font-size:30px;line-height:1}
#tNome{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tRondas{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#tRondas i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid #fff;transition:.2s}
#tRondas i.feito{background:var(--amarelo);border-color:var(--amarelo)}
#tRondas i.atual{background:#fff;transform:scale(1.3)}
.byte-mini{width:54px;height:54px;border:0;background:#fff;border-radius:50%;padding:3px;flex:none}
.byte-mini img{width:100%;height:100%;object-fit:contain;border-radius:50%}
#byteCanto{position:fixed;left:14px;bottom:96px;height:clamp(110px,20vh,170px);pointer-events:none;z-index:20;filter:drop-shadow(0 4px 4px rgba(0,0,0,.12))}
#byteCanto[hidden]{display:none}
#byteCanto.mexe{animation:salto .5s}
@media (max-width:900px){#byteCanto{display:none}}
.byte-mini.fala{animation:bob .35s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px) rotate(4deg)}}

/* palco */
#palco{flex:1;position:relative;overflow:hidden;background-color:var(--creme);background-image:radial-gradient(#F2E3D1 1.6px,transparent 1.6px);background-size:26px 26px}
.area{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,3vh,30px);padding:12px 16px}
.area.topo{justify-content:flex-start}

/* navegação */
#nav{display:flex;justify-content:center;gap:clamp(6px,2vw,22px);padding:6px 10px;background:#fff;border-top:3px solid var(--borda)}
.nb{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--creme);border:3px solid var(--borda);border-radius:16px;padding:5px 12px;min-width:74px}
.nb svg{width:30px;height:30px}
.nb small{font:800 12px var(--fC)}
.nb.grande{background:var(--laranja);color:#fff;border-color:var(--laranja)}
.nb:disabled{opacity:.3;cursor:default}
footer{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px 10px;font-size:12px;padding:3px 8px;color:#8a7f73;background:#fff}
footer a{color:inherit}
#bProf{background:none;border:0;font-size:12px;text-decoration:underline;color:#8a7f73;padding:0}

/* elementos comuns */
.num{font-family:var(--fT);font-weight:700;font-size:clamp(44px,8vh,72px);line-height:1;width:clamp(84px,13vh,120px);height:clamp(84px,13vh,120px);border-radius:24px;border:4px solid #fff;background:var(--azul);color:#fff;box-shadow:0 7px 0 #3d80aa;transition:transform .12s}
.num:active{transform:translateY(3px)}
.num.ok{background:var(--verde);box-shadow:0 7px 0 #4b9a3c;animation:salto .5s}
.abanar{animation:abanar .45s}
@keyframes abanar{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes salto{50%{transform:scale(1.15)}}
@keyframes pulsar{50%{transform:scale(1.07)}}
.opcoes{display:flex;gap:clamp(14px,3vw,36px);flex-wrap:wrap;justify-content:center}
.cartao{background:#fff;border-radius:28px;padding:20px 28px;box-shadow:var(--sombra);border:4px solid var(--borda)}
.grupo{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;max-width:600px}
.grupo span{position:relative;display:inline-block;line-height:1;font-size:clamp(40px,8vh,64px);transition:transform .15s}
.grupo.grande span{font-size:clamp(50px,11vh,92px);cursor:pointer}
.grupo.mini{gap:3px}
.grupo.mini span{font-size:clamp(18px,3.3vh,28px)}
.grupo span.contado{transform:scale(.9)}
.grupo span.contado::after{content:attr(data-c);position:absolute;right:-8px;top:-8px;background:var(--laranja);color:#fff;font:700 20px/30px var(--fT);width:30px;height:30px;border-radius:50%;text-align:center;border:2px solid #fff}
.pontos{display:block;width:100%;height:100%}
.alvo{display:flex;align-items:center;gap:16px;background:#fff;border-radius:24px;padding:8px 22px;box-shadow:var(--sombra);border:4px solid var(--borda);z-index:5;flex:none}
.alvo-num{font:700 clamp(50px,9vh,74px)/1 var(--fT);color:var(--laranja)}
.alvo .pontos{width:clamp(54px,9vh,76px);height:clamp(54px,9vh,76px)}
.contador{display:flex;gap:6px}
.contador i{width:24px;height:24px;border-radius:50%;border:3px solid var(--verde);background:#fff;transition:.2s}
.contador i.cheio{background:var(--verde)}
.btn-pronto{width:clamp(84px,13vh,104px);height:clamp(84px,13vh,104px);border-radius:50%;background:var(--verde);color:#fff;border:4px solid #fff;box-shadow:0 7px 0 #4b9a3c;flex:none;padding:14px}
.btn-pronto svg{width:100%;height:100%}

/* ouve */
.ouvido{width:clamp(110px,19vh,160px);height:clamp(110px,19vh,160px);border-radius:50%;background:var(--laranja);color:#fff;border:6px solid #fff;box-shadow:var(--sombra);padding:26px;animation:pulsar 1.6s infinite}
.ouvido svg{width:100%;height:100%}

/* pares */
.pares{display:flex;gap:clamp(30px,10vw,150px);align-items:center}
.pares .col{display:flex;flex-direction:column;gap:clamp(6px,1.3vh,12px)}
.par-q{width:clamp(140px,24vw,250px);height:clamp(56px,11vh,84px);background:#fff;border:4px solid var(--borda);border-radius:18px;display:flex;align-items:center;justify-content:center;padding:4px;transition:transform .15s}
.par-q .pontos{height:96%;width:auto;aspect-ratio:1}
.par-n{width:clamp(56px,11vh,84px)!important;height:clamp(56px,11vh,84px)!important;font-size:clamp(32px,6vh,50px)!important;border-radius:18px!important;box-shadow:0 5px 0 #3d80aa!important}
.sel{outline:6px solid var(--amarelo);outline-offset:2px;transform:scale(1.06)}
.feito{background:var(--c)!important;border-color:var(--c)!important;box-shadow:none!important;cursor:default}
.feito .pontos circle{fill:#fff}

/* balões */
.ceu{position:relative;flex:1;width:100%;overflow:hidden}
.balao{position:absolute;bottom:-170px;width:clamp(84px,13vh,116px);background:none;border:0;padding:0;animation-name:subir;animation-timing-function:linear;animation-fill-mode:forwards}
.balao svg{width:100%;display:block;animation:balancar 1.8s ease-in-out infinite alternate;transition:transform .25s,opacity .25s}
.balao.rebentado svg{transform:scale(1.7);opacity:0}
@keyframes subir{to{transform:translateY(calc(-1 * var(--h) - 190px))}}
@keyframes balancar{from{rotate:-6deg}to{rotate:6deg}}

/* cesto */
.pedido{display:flex;align-items:center;gap:14px;background:#fff;border-radius:24px;padding:6px 26px;box-shadow:var(--sombra);border:4px solid var(--borda)}
.monte{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:680px;min-height:clamp(60px,11vh,90px)}
.item{font-size:clamp(42px,8.5vh,70px);background:none;border:0;padding:2px 4px;line-height:1;transition:transform .15s}
.item:active{transform:scale(.9)}
.linha-cesto{display:flex;align-items:center;gap:clamp(14px,3vw,30px)}
.cesto{width:min(560px,62vw);min-height:clamp(110px,21vh,180px);border:5px dashed #C9A27E;border-radius:30px;background:#FFF1DF;display:flex;align-items:center;justify-content:center;position:relative;padding:8px}
.cesto-img{position:absolute;font-size:clamp(70px,14vh,110px);opacity:.22;pointer-events:none}
.cesto-itens{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;position:relative}
.cesto.ok{border-style:solid;border-color:var(--verde);background:#EAF7E6}

/* comboio */
.comboio{display:flex;align-items:flex-end;gap:8px;position:relative}
.locomotiva,.foguetao{font-size:clamp(72px,14vh,116px);line-height:1;margin-bottom:6px;display:inline-block}
.foguetao{transition:transform 1.6s ease-in}
.foguetao.lancar{transform:translate(40px,-120vh) rotate(-45deg)}
.vagao{width:clamp(70px,12vh,100px);height:clamp(70px,12vh,100px);background:var(--amarelo);border-radius:14px;border:4px solid #fff;display:flex;align-items:center;justify-content:center;font:700 clamp(38px,7vh,58px)/1 var(--fT);position:relative;box-shadow:var(--sombra);margin-bottom:20px}
.vagao::before,.vagao::after{content:'';position:absolute;bottom:-20px;width:22px;height:22px;border-radius:50%;background:#555;border:3px solid #ddd}
.vagao::before{left:8px}.vagao::after{right:8px}
.vagao.vazio{background:#fff;border:4px dashed #C9A27E;color:#C9A27E}
.vagao.encheu{animation:salto .4s}
.comboio.ok .vagao{background:var(--verde);color:#fff}

/* memória */
.memoria{display:grid;gap:clamp(10px,2vh,18px);grid-template-columns:repeat(3,auto)}
.memoria.m4{grid-template-columns:repeat(4,auto)}
.carta{width:clamp(100px,18vh,150px);height:clamp(120px,22vh,180px);perspective:800px;background:none;border:0;padding:0}
.carta .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.carta.virada .in{transform:rotateY(180deg)}
.frente,.verso{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;border:4px solid #fff;box-shadow:var(--sombra);padding:10px}
.frente{background:var(--byte)}
.frente svg{width:55%;height:55%}
.verso{background:#fff;transform:rotateY(180deg);border-color:var(--borda)}
.carta.feita .verso{border-color:var(--verde);background:#EAF7E6}
.grande-n{font:700 clamp(60px,12vh,96px)/1 var(--fT);color:var(--laranja)}
.verso .pontos{width:85%;height:85%}

/* mais ou menos */
.etiqueta{font:700 clamp(26px,5vh,40px)/1 var(--fT);color:#fff;padding:8px 26px;border-radius:40px;letter-spacing:2px}
.etiqueta.mais{background:var(--laranja)}.etiqueta.menos{background:var(--azul)}
.duelo{display:flex;gap:clamp(16px,4vw,50px);width:100%;justify-content:center;align-items:stretch}
.lado{flex:0 1 400px;min-height:clamp(180px,40vh,330px);background:#fff;border:5px solid var(--borda);border-radius:30px;box-shadow:var(--sombra);display:flex;align-items:center;justify-content:center;padding:16px}
.lado .grupo{max-width:380px}
.lado.ok{background:#EAF7E6;border-color:var(--verde);animation:salto .5s}

/* toupeiras */
.buracos{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2.5vw,30px);width:min(760px,96%);flex:1;align-content:center}
.buraco{position:relative;height:clamp(130px,25vh,200px);overflow:hidden}
.buraco::after{content:'';position:absolute;left:4%;right:4%;bottom:0;height:30%;background:radial-gradient(ellipse at 50% 35%,#3b281c 0%,#5c3f2b 55%,#86643f 100%);border-radius:50%;z-index:3;pointer-events:none}
.toupeira{position:absolute;left:50%;bottom:8%;width:min(76%,150px);transform:translate(-50%,115%);transition:transform .3s ease-out;z-index:2;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center}
.toupeira.sobe{transform:translate(-50%,0)}
.toupeira.apanhada .tp-corpo{filter:brightness(1.2)}
.placa{background:#fff;border:3px solid #8B5E3C;border-radius:12px;width:78%;height:clamp(46px,9vh,70px);display:flex;align-items:center;justify-content:center;font:700 clamp(32px,6vh,52px)/1 var(--fT);color:var(--laranja);margin-bottom:-6px;position:relative;z-index:1}
.placa .pontos{width:auto;height:88%;aspect-ratio:1}
.tp-corpo{width:100%;display:block}

/* desenhar */
.desenho{display:flex;align-items:center;gap:clamp(14px,3vw,40px)}
.tela{background:#fff;border-radius:24px;box-shadow:var(--sombra);border:4px solid var(--borda);touch-action:none;display:block}
.tela.ok{border-color:var(--verde)}
.ferr{display:flex;flex-direction:column;gap:16px;align-items:center}
.ferr .b-f{width:80px;height:80px;border-radius:50%;border:4px solid #fff;background:var(--amarelo);box-shadow:0 6px 0 #d8a43a;padding:16px}
.ferr .b-f svg{width:100%;height:100%}

/* menu */
.menu{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(10px,2vw,22px);width:min(1100px,100%);padding:4px}
.tile{position:relative;background:#fff;border:4px solid var(--borda);border-radius:24px;box-shadow:var(--sombra);padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:clamp(120px,24vh,190px);justify-content:center}
.tile-n{position:absolute;top:6px;left:10px;font:700 18px var(--fT);color:#b8a690}
.tile-ic{font-size:clamp(44px,9vh,72px);line-height:1}
.tile-nome{font:700 clamp(12px,1.5vw,15px)/1.15 var(--fC);text-align:center;color:#7a6e62}
.tile.pulsar{border-color:var(--laranja);animation:pulsar 1.2s infinite}
.est{display:inline-flex;gap:2px}
.est b{font-size:22px;color:#E5D9CB;line-height:1}
.est b.on{color:var(--amarelo);text-shadow:0 1px 0 #d8a43a}

/* início e fins */
.inicio{display:flex;align-items:center;justify-content:center;gap:clamp(20px,5vw,70px);flex-wrap:wrap}
.ini-byte{position:relative;width:clamp(160px,30vh,240px)}
.ini-byte .byte{width:100%;display:block;animation:bob 1s ease-in-out infinite alternate}
.balao-fala{position:absolute;top:-16%;right:62%;background:#fff;border:4px solid var(--borda);border-radius:22px;padding:8px 16px;font:700 clamp(24px,4vh,34px) var(--fT);color:var(--laranja);white-space:nowrap;box-shadow:var(--sombra)}
.ini-txt{display:flex;flex-direction:column;align-items:center;gap:20px}
.ini-txt h1{margin:0;font:700 clamp(40px,8vh,72px)/1 var(--fT);color:var(--byte);text-align:center}
.ini-txt h1 small{display:block;font:700 clamp(16px,2.6vh,22px) var(--fC);color:#8a7f73;margin-top:8px}
.btn-jogar{width:clamp(120px,20vh,170px);height:clamp(120px,20vh,170px);border-radius:50%;background:var(--laranja);color:#fff;border:7px solid #fff;box-shadow:0 8px 0 #c76a35;padding:30px 24px 30px 36px;animation:pulsar 1.3s infinite}
.btn-jogar svg{width:100%;height:100%}
.fim-jogo{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.5vh,22px)}
.fim-jogo .byte{width:clamp(130px,26vh,210px);animation:saltita .6s ease-in-out infinite alternate}
@keyframes saltita{to{transform:translateY(-14px)}}
.est-grandes .est b{font-size:clamp(54px,10vh,80px)}
.fim-botoes{display:flex;gap:22px;align-items:center}
.fb{width:clamp(76px,12vh,96px);height:clamp(76px,12vh,96px);border-radius:50%;border:5px solid #fff;color:#fff;padding:18px}
.fb svg{width:100%;height:100%}
.fb.rep{background:var(--amarelo);box-shadow:0 6px 0 #d8a43a;color:var(--texto)}
.fb.jog{background:var(--azul);box-shadow:0 6px 0 #3d80aa}
.fb.seg{width:clamp(100px,16vh,128px);height:clamp(100px,16vh,128px);background:var(--verde);box-shadow:0 7px 0 #4b9a3c;animation:pulsar 1.2s infinite;padding:22px}
.final-est{display:grid;grid-template-columns:repeat(5,auto);gap:6px 18px}
.final-est div{display:flex;align-items:center;gap:6px;font-size:28px}
.final-est .est b{font-size:18px}
.trofeu{font-size:clamp(60px,12vh,100px);line-height:1}

/* confetes e modal */
.confete{position:fixed;width:11px;height:15px;border-radius:3px;pointer-events:none;z-index:99;animation:conf 1.2s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),calc(var(--dy) + 160px)) rotate(var(--r));opacity:0}}
#modal{position:fixed;inset:0;background:rgba(45,48,71,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
#modal[hidden]{display:none}
.caixa{background:#fff;border-radius:22px;padding:22px 26px;width:min(380px,100%);max-height:92vh;overflow:auto;font-size:15px;user-select:text}
.caixa.larga{width:min(720px,100%)}
.caixa h2{margin:0 0 10px;font:700 24px var(--fT);color:var(--byte)}
.caixa h3{margin:16px 0 8px;font:700 17px var(--fT)}
.caixa input[type=password]{width:100%;font-size:18px;padding:10px;border:2px solid var(--borda);border-radius:10px}
.caixa .linha{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn-txt{background:var(--byte);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:800 15px var(--fC)}
.btn-txt.sec{background:#EEE6DA;color:var(--texto)}
.erro{color:var(--vermelho);font-weight:700;min-height:1em;margin:8px 0 0}
.saltos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.saltos button{text-align:left;background:var(--creme);border:2px solid var(--borda);border-radius:10px;padding:8px 10px;font:700 14px var(--fC)}
.saltos b{color:#d8a43a}
.interr label{display:block;margin:6px 0;font-weight:700}
.nota{font-size:14px;color:#5e554c;line-height:1.45}
.nota ul{margin:4px 0;padding-left:20px}

@media (max-width:760px){
 .menu{grid-template-columns:repeat(3,1fr)}
 .desenho{flex-direction:column}
 .ferr{flex-direction:row}
 .nb{min-width:56px;padding:4px 6px}
}
@media (max-height:620px){ .nb small{display:none} #topo{min-height:50px} }
</style>

 <header id="topo">
  <div class="t-titulo"><span id="tIcone">🔢</span><span id="tNome">Números até 5</span></div>

<script>
'use strict';
/* ===== Números até 5 com o Byte · Gaveta de Fichas · CSO ===== */
const CHAVE='gdf_numeros_ate5_1ano_v1';

/* ---------- números, objetos e representações ---------- */
const NUM_M=['zero','um','dois','três','quatro','cinco'];
const NUM_F=['zero','uma','duas','três','quatro','cinco'];
const nw=(n,f)=>(f?NUM_F:NUM_M)[n];
const OBJ=[
 {e:'🍎',s:'maçã',p:'maçãs',f:1},{e:'⚽',s:'bola',p:'bolas',f:1},{e:'⭐',s:'estrela',p:'estrelas',f:1},
 {e:'🐟',s:'peixe',p:'peixes',f:0},{e:'🚗',s:'carro',p:'carros',f:0},{e:'🦆',s:'pato',p:'patos',f:0},
 {e:'🌸',s:'flor',p:'flores',f:1},{e:'🐞',s:'joaninha',p:'joaninhas',f:1},{e:'🍌',s:'banana',p:'bananas',f:1},
 {e:'🐱',s:'gato',p:'gatos',f:0},{e:'🧸',s:'ursinho',p:'ursinhos',f:0},{e:'🐢',s:'tartaruga',p:'tartarugas',f:1}
];
const qtd=(o,n)=>nw(n,o.f)+' '+(n===1?o.s:o.p);
const quantos=o=>(o.f?'Quantas ':'Quantos ')+o.p;
const PADROES={1:[[50,50]],2:[[28,28],[72,72]],3:[[24,24],[50,50],[76,76]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[24,24],[76,24],[50,50],[24,76],[76,76]]};
function pontos(n,cor='#E8834A'){return `<svg viewBox="0 0 100 100" class="pontos" aria-hidden="true">${PADROES[n].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="11" fill="${cor}"/>`).join('')}</svg>`;}
function grupo(o,n,cls=''){return `<div class="grupo ${cls}">${Array(n).fill(`<span>${o.e}</span>`).join('')}</div>`;}
const numBtn=(x,cls='')=>`<button class="num ${cls}" data-n="${x}" aria-label="${x}">${x}</button>`;
function estrelas(k){return `<span class="est">${[1,2,3].map(i=>`<b class="${i<=k?'on':''}">★</b>`).join('')}</span>`;}
function contavel(cont){let c=0;cont.querySelectorAll('.grupo span').forEach(s=>s.addEventListener('click',()=>{if(s.dataset.c||bloqueado)return;c++;s.dataset.c=c;s.classList.add('contado');SOM.toque();dizer(NUM_M[c]);}));}

/* ---------- estado e gravação ---------- */
const S={voz:true,sons:true,prog:{},prof:false};
function carregar(){try{const d=JSON.parse(localStorage.getItem(CHAVE)||'{}');S.voz=d.voz!==false;S.sons=d.sons!==false;S.prog=d.prog||{};}catch(e){}}
function gravar(){try{localStorage.setItem(CHAVE,JSON.stringify({voz:S.voz,sons:S.sons,prog:S.prog}));}catch(e){}}

/* ---------- temporizadores controlados ---------- */
let sessao=0,timers=[];
function tt(fn,ms){const s=sessao;const id=setTimeout(()=>{timers=timers.filter(x=>x!==id);if(s===sessao)fn();},ms);timers.push(id);return id;}
function novaSessao(){sessao++;timers.forEach(clearTimeout);timers=[];}
function limpar(){novaSessao();calar();}

/* ---------- sons ---------- */
let actx=null;
function audio(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();return actx;}
function tom(f,d,t='sine',v=.2,atraso=0){if(!S.sons)return;const a=audio();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.value=f;const t0=a.currentTime+atraso;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.02);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+.05);}catch(e){}}
const SOM={
 certo(){tom(660,.15,'triangle');tom(990,.28,'triangle',.2,.12);},
 errado(){tom(240,.22,'square',.06);tom(190,.3,'square',.06,.14);},
 pop(){tom(520,.08,'sine',.25);tom(940,.12,'sine',.15,.04);},
 virar(){tom(430,.08,'triangle',.12);},
 toque(){tom(720,.07,'sine',.12);},
 vitoria(){[523,659,784,1047].forEach((f,i)=>tom(f,.3,'triangle',.18,i*.12));}
};

/* ---------- voz (pt-PT) ---------- */
let vozes=[],falaId=0,falaAtual='';
function carregarVozes(){try{vozes=speechSynthesis.getVoices();}catch(e){}}
if('speechSynthesis' in window){carregarVozes();try{speechSynthesis.onvoiceschanged=carregarVozes;}catch(e){}}
function vozPT(){return vozes.find(v=>/pt[-_]PT/i.test(v.lang))||vozes.find(v=>/^pt/i.test(v.lang))||null;}
function calar(){falaId++;try{if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}$('#tByte').classList.remove('fala');}
function dizer(t){
 if(!t||!S.voz||!('speechSynthesis' in window))return;
 const id=++falaId;
 try{speechSynthesis.cancel();}catch(e){}
 setTimeout(()=>{if(id!==falaId)return;try{const u=new SpeechSynthesisUtterance(t);u.lang='pt-PT';const v=vozPT();if(v)u.voice=v;u.rate=.9;u.pitch=1.12;
  u.onstart=()=>$('#tByte').classList.add('fala');u.onend=u.onerror=()=>{if(id===falaId)$('#tByte').classList.remove('fala');};
  speechSynthesis.speak(u);}catch(e){}},80);
}
function instrucao(t){falaAtual=t;dizer(t);}
let desbloqueado=false;
function desbloquear(){if(desbloqueado)return;desbloqueado=true;audio();carregarVozes();}

/* ---------- confetes ---------- */
function confetes(ref,n=40){const r=ref&&ref.getBoundingClientRect?ref.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/3,width:0,height:0};const cx=r.left+r.width/2,cy=r.top+r.height/2;
 for(let i=0;i<n;i++){const c=el('i','confete');c.style.left=cx+'px';c.style.top=cy+'px';c.style.background=pick(CORES);const a=Math.random()*Math.PI*2,d=60+Math.random()*(n>30?260:150);c.style.setProperty('--dx',Math.cos(a)*d+'px');c.style.setProperty('--dy',(Math.sin(a)*d-60)+'px');c.style.setProperty('--r',rnd(-360,360)+'deg');document.body.appendChild(c);setTimeout(()=>c.remove(),1300);}}

/* ---------- motor dos minijogos ---------- */
let modo='inicio',jogoAtual=-1,ronda=0,erros=0,bloqueado=false;
const palco=()=>$('#palco');
const ELOGIOS=['Muito bem!','Boa!','Isso mesmo!','Fantástico!','Excelente!'];
const MINI=['Boa!','Isso!','Mais uma!'];
function certo(elm,frase,depois){
 if(bloqueado)return; bloqueado=true; SOM.certo();
 if(elm){elm.classList.add('ok');confetes(elm,14);} else confetes(null,22);
 dizer(frase||pick(ELOGIOS));poseCanto(Math.random()<.5?'festa':'uau',2200);
 tt(()=>{bloqueado=false;(depois||proximaRonda)();},2300);
}
function errado(elm,frase){
 erros++; SOM.errado();
 if(elm){elm.classList.remove('abanar');void elm.offsetWidth;elm.classList.add('abanar');}
 poseCanto('pensar',1800);dizer(frase||pick(['Tenta outra vez!','Ainda não. Tenta outra vez!','Quase! Pensa bem.']));
 bloqueado=true; tt(()=>{bloqueado=false;},900);
}
function setTopo(ic,nome,rondas){$('#tIcone').textContent=ic;$('#tNome').textContent=nome;$('#tRondas').style.visibility=rondas?'visible':'hidden';}
function atualizarRondas(tudo){const g=JOGOS[jogoAtual];if(!g){$('#tRondas').innerHTML='';return;}
 $('#tRondas').innerHTML=Array.from({length:g.rondas},(_,i)=>`<i class="${tudo||i<ronda?'feito':i===ronda?'atual':''}"></i>`).join('');}
function navEstado(){const emJogo=modo==='jogo'||modo==='fimjogo';
 $('#bAnt').disabled=!((emJogo&&jogoAtual>0)||modo==='final');
 $('#bInicio').disabled=modo==='inicio';}
function iniciarJogo(i){limpar();modo='jogo';mostrarCanto(true);jogoAtual=i;ronda=0;erros=0;bloqueado=false;const g=JOGOS[i];if(g.preparar)g.preparar();setTopo(g.icone,g.nome,true);navEstado();desenharRonda();}
function desenharRonda(){novaSessao();bloqueado=false;atualizarRondas();const a=el('div','area');palco().innerHTML='';palco().appendChild(a);poseCanto('apontar');JOGOS[jogoAtual].ronda(a,ronda);}
function proximaRonda(){ronda++;if(ronda>=JOGOS[jogoAtual].rondas)terminarJogo();else desenharRonda();}
function terminarJogo(){
 novaSessao();modo='fimjogo';mostrarCanto(false);const g=JOGOS[jogoAtual];const e=erros<=1?3:erros<=3?2:1;
 S.prog[g.id]=Math.max(S.prog[g.id]||0,e);gravar();atualizarRondas(true);navEstado();
 const ultimo=jogoAtual===JOGOS.length-1;
 palco().innerHTML=`<div class="area"><div class="fim-jogo">${byteImg('festa')}<div class="est-grandes">${estrelas(e)}</div>
 <div class="fim-botoes"><button class="fb rep" id="fRep" aria-label="Jogar outra vez">${ICON.repetir}</button><button class="fb seg" id="fSeg" aria-label="Seguinte">${ICON.prox}</button><button class="fb jog" id="fJog" aria-label="Jogos">${ICON.grelha}</button></div></div></div>`;
 SOM.vitoria();confetes(null,60);
 instrucao(`Boa! Ganhaste ${e===1?'uma estrela':NUM_F[e]+' estrelas'}! `+(ultimo?'Toca na seta verde para veres o prémio final!':'Toca na seta verde para o jogo seguinte.'));
 $('#fRep').onclick=()=>iniciarJogo(jogoAtual);
 $('#fJog').onclick=mostrarMenu;
 $('#fSeg').onclick=()=>ultimo?mostrarFinal():iniciarJogo(jogoAtual+1);
}

const CAMINHOS={
 1:['M30 40 L58 15 L58 125'],
 2:['M24 44 C24 8 80 8 78 44 C76 68 42 94 22 125 L82 125'],
 3:['M24 32 C38 6 80 12 74 40 C70 60 56 66 44 66 C62 66 82 78 78 100 C74 130 34 132 22 112'],
 4:['M56 15 L20 90 L84 90','M64 52 L64 125'],
 5:['M34 16 L29 62 C42 52 80 52 80 90 C80 126 40 132 22 112','M34 16 L76 16']
};
const J_DESENHA={id:'desenha',nome:'Desenha o número',icone:'✏️',rondas:5,
 ronda(a,r){const n=r+1;
  a.innerHTML=`<div class="desenho"><canvas class="tela"></canvas><div class="ferr"><button class="b-f b-ver" aria-label="Ver outra vez">${ICON.olho}</button><button class="b-f b-apagar" aria-label="Apagar">${ICON.borracha}</button><button class="btn-pronto" aria-label="Pronto">${ICON.check}</button></div></div>`;
  const cv=a.querySelector('canvas');const vert=a.clientWidth<=760;
  let h=Math.min(a.clientHeight-(vert?140:30),540),w=h*100/140;const maxW=a.clientWidth-(vert?40:150);if(w>maxW){w=maxW;h=w*1.4;}
  cv.style.width=w+'px';cv.style.height=h+'px';const dpr=window.devicePixelRatio||1;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  const ctx=cv.getContext('2d'),k=cv.width/100;
  const med=CAMINHOS[n].map(d=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',d);$('#medidor').appendChild(p);const L=p.getTotalLength(),pts=[];for(let s=0;s<=L;s+=2){const q=p.getPointAtLength(s);pts.push([q.x,q.y]);}p.remove();return{L,pts,P:new Path2D(d)};});
  const amostras=med.flatMap(m=>m.pts);
  let tracos=[],atual=null,demo=false;
  const base=()=>{ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.setTransform(k,0,0,k,0,0);ctx.lineCap='round';ctx.lineJoin='round';
   med.forEach(m=>{ctx.strokeStyle='#EADFD0';ctx.lineWidth=16;ctx.stroke(m.P);});
   med.forEach(m=>{ctx.strokeStyle='#fff';ctx.lineWidth=1.6;ctx.setLineDash([2,4]);ctx.stroke(m.P);ctx.setLineDash([]);});
   med.forEach((m,i)=>{const [x,y]=m.pts[0];ctx.fillStyle='#6BBF59';ctx.beginPath();ctx.arc(x,y,6.5,0,7);ctx.fill();
    if(med.length>1){ctx.fillStyle='#fff';ctx.font='700 8px Fredoka, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(i+1),x,y+.5);}});};
  const tinta=()=>{ctx.strokeStyle='#3B7DD8';ctx.lineWidth=7;tracos.forEach(t=>{ctx.beginPath();ctx.moveTo(t[0][0],t[0][1]);if(t.length===1)ctx.lineTo(t[0][0]+.1,t[0][1]);for(const q of t)ctx.lineTo(q[0],q[1]);ctx.stroke();});};
  const redesenhar=()=>{base();tinta();};
  const demonstrar=()=>{demo=true;tracos=[];const s=sessao;let i=0,t0=null;
   const passo=ts=>{if(s!==sessao)return;if(t0===null)t0=ts;const m=med[i],dur=Math.max(900,m.L*13),f=Math.min(1,(ts-t0)/dur),idx=Math.floor(f*(m.pts.length-1));
    base();ctx.strokeStyle='rgba(232,131,74,.6)';ctx.lineWidth=7;
    for(let j=0;j<=i;j++){const pts=med[j].pts,lim=j<i?pts.length-1:idx;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let q=1;q<=lim;q++)ctx.lineTo(pts[q][0],pts[q][1]);ctx.stroke();}
    const [x,y]=m.pts[idx];ctx.fillStyle='#E8834A';ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fill();
    if(f<1)requestAnimationFrame(passo);else if(i<med.length-1){i++;t0=null;requestAnimationFrame(passo);}else tt(()=>{demo=false;redesenhar();},600);};
   requestAnimationFrame(passo);};
  const pos=e=>{const b=cv.getBoundingClientRect();return[(e.clientX-b.left)/b.width*100,(e.clientY-b.top)/b.height*140];};
  cv.onpointerdown=e=>{if(demo||bloqueado)return;e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}atual=[pos(e)];tracos.push(atual);redesenhar();};
  cv.onpointermove=e=>{if(!atual)return;atual.push(pos(e));redesenhar();};
  cv.onpointerup=cv.onpointercancel=()=>{atual=null;};
  a.querySelector('.b-ver').onclick=()=>{if(demo||bloqueado)return;demonstrar();};
  a.querySelector('.b-apagar').onclick=()=>{if(demo||bloqueado)return;SOM.toque();tracos=[];redesenhar();};
  a.querySelector('.btn-pronto').onclick=()=>{if(demo||bloqueado)return;const tin=tracos.flat();
   if(tin.length<6){errado(cv,'Primeiro desenha com o dedo por cima do caminho cinzento.');return;}
   const d2=(p,q)=>(p[0]-q[0])**2+(p[1]-q[1])**2;
   const cob=amostras.filter(p=>tin.some(q=>d2(p,q)<81)).length/amostras.length;
   const dentro=tin.filter(q=>amostras.some(p=>d2(p,q)<144)).length/tin.length;
   if(cob>=.8&&dentro>=.7)certo(cv,`Lindo! Desenhaste o número ${NUM_M[n]}!`);
   else{tracos=[];redesenhar();errado(cv,cob<.8?'Falta um bocadinho. Segue o caminho cinzento até ao fim. Tenta outra vez!':'Saíste do caminho. Vai devagarinho por cima do cinzento.');}};
  instrucao(`Vamos desenhar o número ${NUM_M[n]}. Olha como se faz. Depois, segue o caminho cinzento com o dedo, a começar na bolinha verde. No fim, toca no visto.`);
  base();tt(demonstrar,700);
 }};

function sha256(ascii){function rr(v,a){return(v>>>a)|(v<<(32-a));}const mp=Math.pow,mw=mp(2,32);let i,j,res='';const w0=[],bl=ascii.length*8;const h=[],k=[];let pc=0;const comp={};
 for(let c=2;pc<64;c++){if(!comp[c]){for(i=0;i<313;i+=c)comp[i]=c;h[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0;}}
 let hash=h.slice(0,8);ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
 for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return'';w0[i>>2]|=j<<((3-i)%4)*8;}
 w0[w0.length]=((bl/mw)|0);w0[w0.length]=bl;
 for(j=0;j<w0.length;){const w=w0.slice(j,j+=16);const old=hash;hash=hash.slice(0,8);
  for(i=0;i<64;i++){const w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
   const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
   const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
   hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0;}
  for(i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0;}
 for(i=0;i<8;i++)for(j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16);}
 return res;}
